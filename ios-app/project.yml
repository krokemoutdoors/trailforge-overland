name: TrailForgeOverland
options:
  bundleIdPrefix: com.edwardshin
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: bottom
targets:
  TrailForgeOverland:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardshin.trailforge
        PRODUCT_NAME: TrailForgeOverland
        DEVELOPMENT_TEAM: 25VZT7485A
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "7"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    sources:
      - path: .
        excludes:
          - project.yml
          - TrailForgeProducts.storekit
          - "**/*.xcodeproj/**"
          - "**/xcuserdata/**"
      - path: TrailForgeProducts.storekit
        buildPhase: none
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: StoreKit.framework
      - sdk: MultipeerConnectivity.framework
      - sdk: AVFoundation.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "TrailForge Overland"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "7"
        LSApplicationQueriesSchemes:
          - comgooglemaps
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "TrailForge Overland uses your location to display your 4x4 rig on offline topo trails, check rig-fit clearances, and find flat dispersed campsites."
        NSLocationAlwaysAndWhenInUseUsageDescription: "TrailForge records your backcountry GPX breadcrumb trail even when your screen is locked."
        NSMotionUsageDescription: "TrailForge Overland uses the gyroscope and accelerometer for the real-time Pitch & Roll 4x4 Clinometer."
        NSBluetoothAlwaysUsageDescription: "TrailForge uses Bluetooth for offline peer-to-peer convoy location sharing when out of cell range."
        NSLocalNetworkUsageDescription: "TrailForge Overland uses peer-to-peer mesh networking to share convoy waypoints offline without cell service."
        NSBonjourServices:
          - _trailforge-convoy._tcp
          - _trailforge-convoy._udp
    scheme:
      storeKitConfiguration: TrailForgeProducts.storekit
