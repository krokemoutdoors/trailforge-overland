name: TrailForgeOverland
options:
  bundleIdPrefix: com.edwardshin
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: bottom
targets:
  TrailForgeOverland:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edwardshin.trailforge
        PRODUCT_NAME: TrailForgeOverland
        DEVELOPMENT_TEAM: 25VZT7485A
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    sources:
      - path: .
        excludes:
          - project.yml
          - TrailForgeProducts.storekit
          - "**/*.xcodeproj/**"
          - "**/xcuserdata/**"
      - path: TrailForgeProducts.storekit
        buildPhase: none
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: StoreKit.framework
      - sdk: MultipeerConnectivity.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "TrailForge Overland"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "TrailForge uses your GPS location to display your 4x4 rig on offline USGS topographic maps and record GPX tracks."
        NSLocationAlwaysAndWhenInUseUsageDescription: "TrailForge records your backcountry GPX breadcrumb trail even when your screen is locked."
        NSBluetoothAlwaysUsageDescription: "TrailForge uses Bluetooth for offline peer-to-peer convoy location sharing when out of cell range."
        NSLocalNetworkUsageDescription: "TrailForge connects to nearby convoy vehicles over peer-to-peer mesh."
    scheme:
      storeKitConfiguration: TrailForgeProducts.storekit
