name: Android Release Build

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under ${ANDROID_HOME}/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create the release keystore
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TRAILFORGE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRAILFORGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TRAILFORGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            if [ -z "${TRAILFORGE_STORE_PASSWORD}" ] || [ -z "${TRAILFORGE_KEY_PASSWORD}" ]; then
              echo "ANDROID_KEYSTORE_BASE64 is set but the keystore passwords are missing."
              exit 1
            fi
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > trailforge-release.jks
            STORE_PASS="${TRAILFORGE_STORE_PASSWORD}"
            KEY_PASS="${TRAILFORGE_KEY_PASSWORD}"
            ALIAS="${TRAILFORGE_KEY_ALIAS:-trailforge}"
          else
            STORE_PASS="${TRAILFORGE_STORE_PASSWORD:-trailforge-ci-keystore}"
            KEY_PASS="${TRAILFORGE_KEY_PASSWORD:-$STORE_PASS}"
            ALIAS="${TRAILFORGE_KEY_ALIAS:-trailforge}"
            keytool -genkeypair -v \
              -keystore trailforge-release.jks \
              -storetype JKS \
              -alias "${ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASS}" \
              -keypass "${KEY_PASS}" \
              -dname "CN=TrailForge Overland, OU=Android, O=KrokeM Outdoors, L=Seattle, ST=Washington, C=US"
          fi
          {
            echo "TRAILFORGE_STORE_FILE=${GITHUB_WORKSPACE}/android-app/trailforge-release.jks"
            echo "TRAILFORGE_STORE_PASSWORD=${STORE_PASS}"
            echo "TRAILFORGE_KEY_PASSWORD=${KEY_PASS}"
            echo "TRAILFORGE_KEY_ALIAS=${ALIAS}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp app/build/outputs/apk/release/*-release.apk "${GITHUB_WORKSPACE}/dist/TrailForge-Overland-v1.2.0-release.apk"
          cp app/build/outputs/bundle/release/*.aab "${GITHUB_WORKSPACE}/dist/TrailForge-Overland-v1.2.0-release.aab"

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrailForge-Overland-v1.2.0
          path: |
            dist/TrailForge-Overland-v1.2.0-release.apk
            dist/TrailForge-Overland-v1.2.0-release.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-android
          name: TrailForge Overland v1.2.0 (Android)
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          make_latest: false
          generate_release_notes: false
          body: |
            TrailForge Overland 1.2.0 (versionCode 8) for Android and Google Play.

            - `TrailForge-Overland-v1.2.0-release.apk` installs directly on an Android phone.
            - `TrailForge-Overland-v1.2.0-release.aab` uploads to Google Play Console.

            Package: `com.edwardshin.trailforge`. The release is signed with `trailforge-release.jks`. Set `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_PASSWORD`, and `ANDROID_KEY_ALIAS` to reuse one upload key. Without those secrets, CI generates a fresh keystore for that run.
          files: |
            dist/TrailForge-Overland-v1.2.0-release.apk
            dist/TrailForge-Overland-v1.2.0-release.aab
          fail_on_unmatched_files: true
