name: Build & Upload TrailForge Overland to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use committed Xcode project
        run: |
          cd ios-app
          if [ ! -f TrailForgeOverland.xcodeproj/project.pbxproj ]; then
            echo "Committed project.pbxproj is missing; installing xcodegen and generating the project"
            brew install xcodegen
            xcodegen generate
          else
            echo "Using committed TrailForgeOverland.xcodeproj; not running xcodegen"
          fi
          test -f TrailForgeOverland.xcodeproj/project.pbxproj
          grep -q 'objectVersion = 56;' TrailForgeOverland.xcodeproj/project.pbxproj

      - name: Verify Swift Compile (Simulator Smoke Test)
        run: |
          cd ios-app
          xcodebuild -project TrailForgeOverland.xcodeproj \
            -scheme TrailForgeOverland \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
