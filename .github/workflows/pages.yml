name: Deploy Privacy Policy & Support Page to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/app/**'
      - 'web-landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Copy the overland PWA into the Pages site
        run: mkdir -p web-landing/app && cp -R docs/app/. web-landing/app/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web-landing'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
