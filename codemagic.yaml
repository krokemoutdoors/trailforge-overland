workflows:
  ios-appstore-release:
    name: TrailForge Overland — App Store Connect Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.edwardshin.trailforge"
        APPLE_TEAM_ID: "25VZT7485A"
        XCODE_PROJECT: "ios-app/TrailForgeOverland.xcodeproj"
        XCODE_SCHEME: "TrailForgeOverland"
    scripts:
      - name: Use committed Xcode project
        script: |
          if [ ! -f ios-app/TrailForgeOverland.xcodeproj/project.pbxproj ]; then
            echo "Committed project.pbxproj is missing; generating with xcodegen"
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            (cd ios-app && xcodegen generate)
          else
            echo "Using committed ios-app/TrailForgeOverland.xcodeproj; not running xcodegen"
          fi
          test -f "$XCODE_PROJECT/project.pbxproj"
      - name: Initialize keychain & fetch signing files from App Store Connect API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build signed IPA for App Store / TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Publish IPA to App Store Connect / TestFlight
        script: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-simulator-verify:
    name: TrailForge Overland — Simulator verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.edwardshin.trailforge"
        XCODE_PROJECT: "TrailForgeOverland.xcodeproj"
        XCODE_SCHEME: "TrailForgeOverland"
      xcode: latest
    scripts:
      - name: Use committed Xcode project
        script: |
          cd ios-app
          if [ ! -f TrailForgeOverland.xcodeproj/project.pbxproj ]; then
            echo "Committed project.pbxproj is missing; generating with xcodegen"
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            xcodegen generate
          else
            echo "Using committed TrailForgeOverland.xcodeproj; not running xcodegen"
          fi
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
      - name: Build an unsigned iOS Simulator app
        script: |
          cd ios-app
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios-app/build/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
