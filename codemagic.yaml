workflows:
  ios-simulator-verify:
    name: TrailForge Overland — Simulator verification
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        BUNDLE_ID: "com.edwardshin.trailforge"
        XCODE_PROJECT: "TrailForgeOverland.xcodeproj"
        XCODE_SCHEME: "TrailForgeOverland"
      xcode: latest
    scripts:
      - name: Use committed Xcode project
        script: |
          cd ios-app
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen is installed; regenerating TrailForgeOverland.xcodeproj from project.yml"
            xcodegen generate
          else
            echo "xcodegen is not installed; using the committed TrailForgeOverland.xcodeproj"
          fi
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
      - name: Build an unsigned iOS Simulator app
        script: |
          cd ios-app
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios-app/build/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-appstore-release:
    name: TrailForge Overland — Cloud iOS Build & TestFlight Upload
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Create an App Store Connect API key in Codemagic named TrailForge_ASC
    # after Apple Developer enrollment, then start this workflow.
    integrations:
      app_store_connect: TrailForge_ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.edwardshin.trailforge
      vars:
        BUNDLE_ID: "com.edwardshin.trailforge"
        XCODE_PROJECT: "TrailForgeOverland.xcodeproj"
        XCODE_SCHEME: "TrailForgeOverland"
      xcode: latest
    scripts:
      - name: Use committed Xcode project
        script: |
          cd ios-app
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen is installed; regenerating TrailForgeOverland.xcodeproj from project.yml"
            xcodegen generate
          else
            echo "xcodegen is not installed; using the committed TrailForgeOverland.xcodeproj"
          fi
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
      - name: Set up code signing settings on Xcode project
        script: |
          cd ios-app
          xcode-project use-profiles
      - name: Build .ipa for App Store & TestFlight
        script: |
          cd ios-app
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
